name: Python CI
on: 
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: [2.7, 3.5, 3.6, 3.7, 3.8, 3.9, '3.10']

    steps:
      - uses: actions/checkout@0717577d45739eb3c851188b29f50ed6c0b2194e # v2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@e9aba2c848f5ebd159c070c61ea2c4e2b122355e # v2
        with:
          python-version: ${{ matrix.python-version }}
      - name: Dependencies
        run: |
          pip install -r requirements-dev.txt
      - name: Repair Python 3.5 dlint syntax without changing checks
        if: matrix.python-version == 3.5
        run: |
          python tools/dlint35_compat.py
          python tools/validate_dlint35.py
      - name: Lint with flake8
        run: flake8
      - name: Test with nose2
        run: nose2

  django-demo:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: demos/django
    steps:
      - uses: actions/checkout@0717577d45739eb3c851188b29f50ed6c0b2194e
        with:
          persist-credentials: false
      - uses: actions/setup-python@e9aba2c848f5ebd159c070c61ea2c4e2b122355e
        with:
          python-version: '3.10'
      - name: Install candidate SDK and demo dependencies
        run: |
          pip install ../..
          pip install -r requirements.txt
      - run: python manage.py check --fail-level WARNING
      - run: python manage.py makemigrations
      - run: python manage.py migrate --noinput
      - run: python manage.py test duo_app --noinput
